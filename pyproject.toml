[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "career-evidence-agent"
version = "0.1.0"
description = "Evidence-grounded job analysis agent with a growing capability profile"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9,<2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
